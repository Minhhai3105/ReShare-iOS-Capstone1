# Ping /health của backend Render theo lịch.
#
# Render free tier ngủ sau ~15 phút không có request; đo thực tế cold start
# mất 19–22 giây.
#
# THỰC TẾ (đo 11–13/11/2026): lịch '*/5' KHÔNG giữ được backend thức. GitHub
# không đảm bảo giờ chạy của scheduled workflow; các lần chạy thật cách nhau
# 4–8 tiếng chứ không phải 5 phút. Workflow này chỉ còn tác dụng kiểm tra
# định kỳ backend còn sống (job đỏ nếu /health không trả 200).
#
# Quyết định của nhóm (13/11/2026): chấp nhận backend ngủ. Trước buổi demo
# hoặc bảo vệ, mở https://reshare-ios-capstone1-1.onrender.com/health (hoặc
# bấm "Run workflow" ở tab Actions) rồi chờ 20–30 giây cho backend dậy.
#
# Repo đang PUBLIC nên GitHub Actions không tính phút — không tốn gì.
# Lưu ý: GitHub tự tắt scheduled workflow sau 60 ngày repo không có commit.
name: Keep-alive backend

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

# Nếu lần chạy trước chưa xong (backend đang cold start) thì bỏ lần mới,
# tránh dồn job khi Render chậm.
concurrency:
  group: keepalive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /health
        run: |
          URL=https://reshare-ios-capstone1-1.onrender.com/health
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -m 120 -w '%{http_code}' "$URL" || echo 000)
            if [ "$code" = "200" ]; then
              echo "Lần $i: HTTP 200 — backend đang thức."
              exit 0
            fi
            echo "Lần $i: HTTP $code — thử lại sau 15s."
            sleep 15
          done
          echo "::error::Backend không trả 200 sau 3 lần thử. Kiểm tra Render dashboard."
          exit 1
